# =============================================================================
# KONFIGURASI NGINX UNTUK FULLSTACK (REACT FRONTEND + GO BACKEND REVERSE PROXY)
# =============================================================================

# Server Block Utama: Menyajikan Single Page Application (React) & Proxy API Go
server {
    listen 80;
    server_name app.domainkamu.com localhost; # Ganti dengan domain atau IP Public server Anda

    # File log
    access_log /var/log/nginx/productflow.access.log;
    error_log /var/log/nginx/productflow.error.log;

    # Batas ukuran payload request
    client_max_body_size 10M;

    # 1. Routing REST API ke Backend Go (Port 8080)
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 2. Routing Health Check ke Backend Go
    location /health {
        proxy_pass http://127.0.0.1:8080/health;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Static Files Frontend React (Hasil build: `npm run build` -> dist/)
    location / {
        root /var/www/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
